<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralPulse Pro - Global</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0;
        }
        select {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
        }
        .content {
            margin-bottom: 20px;
        }
        p {
            line-height: 1.6;
            color: #94a3b8;
        }
        button {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 id="app-title">ViralPulse Pro</h1>
            <select id="langSelect" onchange="changeLanguage()">
                <option value="tr">Türkçe</option>
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
                <option value="pt">Português</option>
                <option value="ru">Русский</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="zh">中文</option>
                <option value="ar">العربية</option>
                <option value="hi">हिन्दी</option>
                <option value="nl">Nederlands</option>
                <option value="pl">Polski</option>
                <option value="sv">Svenska</option>
                <option value="tr-alt">Azərbaycan</option>
                <option value="uk">Українська</option>
                <option value="vi">Tiếng Việt</option>
                <option value="id">Bahasa Indonesia</option>
            </select>
        </div>
        <div class="content">
            <p id="app-desc">Küresel ölçekte en son trendleri takip edin ve analiz edin. Tamamen tarayıcınızda çalışan hızlı ve modern araç.</p>
        </div>
        <button id="app-btn">Analizi Başlat</button>
    </div>

            fr: { title: "ViralPulse Pro", desc: "Suivez et analysez les dernières tendances mondiales. Un outil rapide et moderne s'exécutant entièrement dans votre navigateur.", btn: "Démarrer l'analyse" },
            de: { title: "ViralPulse Pro", desc: "Verfolgen Sie die neuesten globalen Trends. Ein schnelles und modernes Tool, das vollständig in Ihrem Browser läuft.", btn: "Analyse starten" },
            it: { title: "ViralPulse Pro", desc: "Traccia e analizza gli ultimi trend globali. Uno strumento veloce e moderno che funziona interamente nel tuo browser.", btn: "Avvia Analisi" },
            pt: { title: "ViralPulse Pro", desc: "Acompanhe e analise as últimas tendências globais. Uma ferramenta rápida e moderna executada inteiramente no seu navegador.", btn: "Iniciar Análise" },

            ja: { title: "ViralPulse Pro", desc: "最新のグローバルなトレンドを追跡・分析します。ブラウザで完全に動作する高速でモダンなツール。", btn: "分析を開始" },

            zh: { title: "ViralPulse Pro", desc: "追踪并分析最新的全球趋势。一个完全在您的浏览器中运行的快速且现代的工具。", btn: "开始分析" },

            hi: { title: "ViralPulse Pro", desc: "नवीनतम वैश्विक रुझानों को ट्रैक और विश्लेषण करें। आपके ब्राउज़र में पूरी तरह से चलने वाला एक तेज़ और आधुनिक टूल।", btn: "विश्लेषण शुरू करें" },

            "tr-alt": { title: "ViralPulse Pro", desc: "Qlobal miqyasda son trendləri izləyin və təhlil edin. Tamamilə brauzerinizdə işləyən sürətli və müasir alət.", btn: "Təhlilə Başla" },
            uk: { title: "ViralPulse Pro", desc: "Відстежуйте та аналізуйте останні глобальні тренди. Швидкий та сучасний інструмент, що працює прямо у браузері.", btn: "Розпочати аналіз" },

        function changeLanguage() {
            const selectedLang = document.getElementById('langSelect').value;
            const t = translations[selectedLang];
            if (t) {
                document.getElementById('app-title').innerText = t.title;
                document.getElementById('app-desc').innerText = t.desc;
                document.getElementById('app-btn').innerText = t.btn;
            }
        }
    </script>
</body>
</html>
