            document.getElementById('btnCopyTags').innerText = t.btnCopyTags;
            document.getElementById('lblHistory').innerText = t.lblHistory;
            document.getElementById('lblFavorites').innerText = t.lblFavorites;
            document.getElementById('shareBtn').innerHTML = t.shareBtn;
            
            if(!isUnlocked) {
                document.getElementById('lockText').innerText = t.lockText;
            }
            renderFavorites();
        }

        function fillRandomIdea() {
            const list = sampleIdeas[currentLang] || sampleIdeas['en'];
            document.getElementById('ideaInput').value = list[Math.floor(Math.random() * list.length)];
        }

        window.onload = function() {
            renderFavorites();
            checkLockStatus();
        };

        function checkLockStatus() {
            const lockSection = document.getElementById('lockSection');
            if(isUnlocked) {
                lockSection.classList.add('hidden');
            } else {
                lockSection.classList.remove('hidden');
            }
        }

        function switchTab(tab) {
            const genSec = document.getElementById('generatorSection');
            const anaSec = document.getElementById('analyzerSection');
            const genBtn = document.getElementById('genTabBtn');
            const anaBtn = document.getElementById('analyzerTabBtn');

            if(tab === 'generator') {
                genSec.classList.remove('hidden');
                anaSec.classList.add('hidden');
                genBtn.className = "py-2.5 text-xs font-bold rounded-xl bg-red-600 text-white transition-all shadow-md";
                anaBtn.className = "py-2.5 text-xs font-semibold rounded-xl text-zinc-400 hover:text-white transition-all";
            } else {
                genSec.classList.add('hidden');
                anaSec.classList.remove('hidden');
                anaBtn.className = "py-2.5 text-xs font-bold rounded-xl bg-blue-600 text-white transition-all shadow-md";
                genBtn.className = "py-2.5 text-xs font-semibold rounded-xl text-zinc-400 hover:text-white transition-all";
            }
        }

        function setTheme(theme) {
            const body = document.getElementById('bodyBg');
            const btn = document.getElementById('generateBtn');
            const anaBtn = document.getElementById('analyzeBtn');
            const badge = document.getElementById('badgeColor');

            if(theme === 'purple') {
                body.className = "bg-[#0b0414] text-zinc-100 min-h-screen flex flex-col items-center justify-center p-4 transition-all duration-500 font-sans";
                btn.className = "w-full bg-purple-600 hover:bg-purple-500 font-bold py-3.5 rounded-2xl transition-all shadow-lg text-xs tracking-wider uppercase text-white cursor-pointer";
                anaBtn.className = "w-full bg-purple-600 hover:bg-purple-500 font-bold py-3.5 rounded-2xl transition-all shadow-lg text-xs tracking-wider uppercase text-white cursor-pointer";
                badge.className = "bg-purple-500/10 text-purple-400 text-[11px] font-bold px-3.5 py-1 rounded-full uppercase tracking-wider border border-purple-500/20";
            } else if(theme === 'emerald') {
                body.className = "bg-[#02140c] text-zinc-100 min-h-screen flex flex-col items-center justify-center p-4 transition-all duration-500 font-sans";
                btn.className = "w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3.5 rounded-2xl transition-all shadow-lg text-xs tracking-wider uppercase text-white cursor-pointer";
                anaBtn.className = "w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3.5 rounded-2xl transition-all shadow-lg text-xs tracking-wider uppercase text-white cursor-pointer";
                badge.className = "bg-emerald-500/10 text-emerald-400 text-[11px] font-bold px-3.5 py-1 rounded-full uppercase tracking-wider border border-emerald-500/20";
            } else {
                body.className = "bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center justify-center p-4 transition-all duration-500 font-sans";
                btn.className = "w-full bg-red-600 hover:bg-red-500 font-bold py-3.5 rounded-2xl transition-all shadow-lg text-xs tracking-wider uppercase text-white cursor-pointer";
                anaBtn.className = "w-full bg-blue-600 hover:bg-blue-500 font-bold py-3.5 rounded-2xl transition-all shadow-lg text-xs tracking-wider uppercase text-white cursor-pointer";
                badge.className = "bg-red-500/10 text-red-500 text-[11px] font-bold px-3.5 py-1 rounded-full uppercase tracking-wider border border-red-500/20";
            }
        }

        const matrixData = {
            tr: {
                openings: [
                    "Bunu kimseye söylemem gerekiyordu ama {idea} konusundaki bu gizli detay",
                    "Gece yarısı fark ettiğim o kritik ayrıntı: {idea} gerçeğini",
                    "Sektördeki herkesin gizlemeye çalıştığı {idea} olayı nihayet",
                    "Bilmen gereken ama bizden saklanan {idea} sırrı aslında"
                ],
                actions: ["kökten değiştirerek", "beklenmedik sonuçlar doğurarak", "tüm bilinenleri alt üst ederek"],
                closings: ["bugünden itibaren her şeyi farklı görmenizi sağlayacak.", "ilk günden sonuç almanızı garantiliyor."]
            },
            en: {
                openings: [
                    "I wasn't supposed to share this, but this secret detail about {idea}",
                    "The tiny detail I noticed at midnight regarding {idea}",
                    "The {idea} truth that everyone in the industry tries to hide"
                ],
                actions: ["completely shattering standard rules", "turning traditional plans upside down"],
                closings: ["will make you see everything differently from today.", "guarantees results right from day one."]
            }
        };

        function generateUltimateHook() {
            const idea = document.getElementById('ideaInput').value.trim();
            const platform = document.getElementById('platformSelect').value;
            const t = translations[currentLang] || translations['en'];

            if(!idea) {
                alert(t.alertIdea);
                return;
            }

            const resultArea = document.getElementById('resultArea');
            const hookOutput = document.getElementById('hookOutput');
            const viralScoreText = document.getElementById('viralScoreText');
            const tagSection = document.getElementById('tagSection');
            const tagOutput = document.getElementById('tagOutput');
            const proReportBox = document.getElementById('proReportBox');

            resultArea.classList.remove('hidden');
            proReportBox.classList.add('hidden');

            const langObj = matrixData[currentLang] || matrixData['en'];
            const randomOpen = langObj.openings[Math.floor(Math.random() * langObj.openings.length)];
            const randomAction = langObj.actions[Math.floor(Math.random() * langObj.actions.length)];
            const randomClose = langObj.closings[Math.floor(Math.random() * langObj.closings.length)];

            const finalHook = `${randomOpen} ${randomAction} ${randomClose}`.replace(/{idea}/g, `"${idea}"`);
            
            hookOutput.value = finalHook;
            updateCharCount(finalHook);

            const cleanWord = idea.replace(/[^a-zA-Z0-9]/g, "");
            currentTagsText = `#${cleanWord} #${platform} #viral #foryou #trending`;
            tagOutput.innerText = currentTagsText;
            tagSection.classList.remove('hidden');

            viralScoreText.innerText = `%${Math.floor(Math.random() * 6) + 94} Viral Güç 🔥`;
            addToHistory(finalHook);
        }

        function analyzeCustomHook() {
            const customHook = document.getElementById('customHookInput').value.trim();
            const t = translations[currentLang] || translations['en'];

            if(!customHook) {
                alert(t.alertHook);
                return;
            }

            const resultArea = document.getElementById('resultArea');
            const hookOutput = document.getElementById('hookOutput');
            const viralScoreText = document.getElementById('viralScoreText');
            const tagSection = document.getElementById('tagSection');
            const proReportBox = document.getElementById('proReportBox');

            resultArea.classList.remove('hidden');
            hookOutput.value = customHook;
            updateCharCount(customHook);
            tagSection.classList.add('hidden');

            let score = 91;
            let report = "💡 **AI Psikoloji Raporu:** Metin güçlü bir merak kancası (`curiosity gap`) barındırıyor.";
            
            if(customHook.length < 20) {
                score = 68;
                report = "⚠️ **AI Uyarı:** Kanca çok kısa. İzleyicide dopamin etkisi yaratmak için biraz daha gizem ekleyin.";
            }

            viralScoreText.innerText = `%${score} Dopamin Skoru 🎯`;
            proReportBox.innerHTML = report;
            proReportBox.classList.remove('hidden');

            addToHistory(customHook);
        }

        function updateCharCount(text) {
            const charText = currentLang === 'tr' ? 'karakter' : currentLang === 'de' ? 'Zeichen' : 'chars';
            document.getElementById('charCount').innerText = `${text.length} ${charText}`;
        }

        function addToHistory(text) {
            if(!historyArray.includes(text)) {
                historyArray.unshift(text);
                if(historyArray.length > 5) historyArray.pop();
            }
            updateHistoryUI();
        }

        function updateHistoryUI() {
            const historyList = document.getElementById('historyList');
            if(historyArray.length > 0) {
                historyList.innerHTML = historyArray.map(item => `
                    <div class="bg-zinc-950 border border-zinc-800 rounded-xl p-2 text-[10px] text-zinc-300 flex justify-between items-center gap-2">
                        <span class="truncate">${item}</span>
                        <button onclick="copySpecific('${item.replace(/'/g, "\\'")}')" class="text-red-400 hover:text-red-300 font-bold shrink-0 cursor-pointer">📋</button>
                    </div>
                `).join('');
            }
        }

        function saveToFavorites() {
            const text = document.getElementById('hookOutput').value;
            const t = translations[currentLang] || translations['en'];
            if(!text || favoritesArray.includes(text)) return;
            favoritesArray.unshift(text);
            localStorage.setItem('viralFavoritesPro', JSON.stringify(favoritesArray));
            renderFavorites();
            alert(t.favAdded);
        }

        function renderFavorites() {
            const favList = document.getElementById('favoritesList');
            const t = translations[currentLang] || translations['en'];
            if(favoritesArray.length > 0) {
                favList.innerHTML = favoritesArray.map((item, index) => `
                    <div class="bg-zinc-950 border border-zinc-800 rounded-xl p-2 text-[10px] text-zinc-300 flex justify-between items-center gap-2">
                        <span class="truncate">${item}</span>
                        <button onclick="removeFavorite(${index})" class="text-yellow-400 hover:text-yellow-300 font-bold shrink-0 cursor-pointer">❌</button>
                    </div>
                `).join('');
            } else {
                favList.innerHTML = `<span class="text-[10px] text-zinc-600">${t.emptyFav}</span>`;
            }
        }

        function removeFavorite(index) {
            favoritesArray.splice(index, 1);
            localStorage.setItem('viralFavoritesPro', JSON.stringify(favoritesArray));
            renderFavorites();
        }

        function copyCurrentHook() {
            const text = document.getElementById('hookOutput').value;
            const t = translations[currentLang] || translations['en'];
            if(!text) return;
            navigator.clipboard.writeText(text);
            const btn = document.getElementById('copyBtn');
            const original = btn.innerText;
            btn.innerText = t.copied;
            setTimeout(() => btn.innerText = original, 1500);
        }

        function copyTags() {
            const t = translations[currentLang] || translations['en'];
            if(!currentTagsText) return;
            navigator.clipboard.writeText(currentTagsText);
            alert(t.tagsCopied);
        }

        function copySpecific(text) {
            const t = translations[currentLang] || translations['en'];
            navigator.clipboard.writeText(text);
            alert(t.copiedText);
        }

        function speakCurrentHook() {
            const text = document.getElementById('hookOutput').value;
            if(!text) return;
            
            if (!('speechSynthesis' in window)) {
                alert("Tarayıcınız ses sentezini desteklemiyor.");
                return;
            }

            window.speechSynthesis.cancel();

            setTimeout(() => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                
                const langMap = { tr: 'tr-TR', en: 'en-US', de: 'de-DE', fr: 'fr-FR', es: 'es-ES', ru: 'ru-RU', az: 'az-AZ' };
                utterance.lang = langMap[currentLang] || 'tr-TR';

                window.speechSynthesis.speak(utterance);
            }, 50);
        }

        function handleRealWhatsAppShare() {
            const t = translations[currentLang] || translations['en'];
            const shareText = encodeURIComponent("🚀 ViralPulse Pro - Yapay Zeka Kanca Üreticisi:\n" + window.location.href);
            
            window.open(`https://api.whatsapp.com/send?text=${shareText}`, '_blank');

            isUnlocked = true;
            localStorage.setItem('viralPulseUnlocked', 'true');
            checkLockStatus();
            alert(t.unlockedMsg);
        }
    </script>
</body>
</html>
