<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralPulse - Pro Analyzer Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body id="bodyBg" class="bg-black text-white min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-500">

    <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl relative">
        
        <!-- Üst Sağ Tema Değiştirici -->
        <div class="absolute top-4 right-4 flex gap-1">
            <button onclick="setTheme('black')" title="Siyah Mod" class="w-4 h-4 rounded-full bg-black border border-zinc-600"></button>
            <button onclick="setTheme('purple')" title="Cyberpunk Mor" class="w-4 h-4 rounded-full bg-purple-600"></button>
            <button onclick="setTheme('green')" title="Matrix Yeşil" class="w-4 h-4 rounded-full bg-emerald-600"></button>
        </div>

        <div class="text-center mb-6">
            <span id="badgeColor" class="bg-red-500/10 text-red-500 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Viral Makine v10.0 PRO ANALYZER</span>
            <h1 class="text-2xl font-black mt-2 tracking-tight">Algoritmayı Tamamen Hackle 🚀</h1>
            <p class="text-zinc-400 text-sm mt-1">Sınırsız matris üretimi ve AI Kanca Performans Analizcisi.</p>
        </div>

        <!-- Sekme Geçiş Butonları -->
        <div class="grid grid-cols-2 gap-2 mb-4 bg-zinc-800/80 p-1 rounded-xl border border-zinc-700">
            <button onclick="switchTab('generator')" id="genTabBtn" class="py-2 text-xs font-bold rounded-lg bg-red-600 text-white transition-all">⚡ Kanca Üretici</button>
            <button onclick="switchTab('analyzer')" id="analyzerTabBtn" class="py-2 text-xs font-semibold rounded-lg text-zinc-400 hover:text-white transition-all">🎯 Kanca Test Et</button>
        </div>

        <!-- 1. SEKME: KANCA ÜRETİCİ -->
        <div id="generatorSection" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-zinc-400 mb-1 uppercase">Hedef Platform</label>
                <select id="platformSelect" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none text-sm">
                    <option value="tiktok">TikTok / Reels / Shorts (Hızlı & Çarpıcı)</option>
                    <option value="youtube">YouTube Başlığı (Tıklama Odaklı)</option>
                    <option value="twitter">X / Twitter (Tartışma Yaratan Thread)</option>
                    <option value="sales">Satış & Dönüşüm Metni</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1 uppercase">Anlatım Tonu</label>
                    <select id="toneSelect" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-3 text-white focus:outline-none text-xs">
                        <option value="mystery">Gizemli 🕵️‍♂️</option>
                        <option value="aggressive">Sarsıcı 🔥</option>
                        <option value="success">Başarı 📈</option>
                        <option value="funny">Mizahi 😂</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1 uppercase">Kanca Yapısı</label>
                    <select id="styleSelect" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-3 text-white focus:outline-none text-xs">
                        <option value="short">Kısa & Vurucu</option>
                        <option value="story">Hikaye / İtiraf</option>
                    </select>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-semibold text-zinc-400 uppercase">İçerik Konun / Fikrin nedir?</label>
                    <button onclick="fillRandomIdea()" class="text-[10px] text-red-400 hover:text-red-300">💡 Rastgele Fikir</button>
                </div>
                <input type="text" id="ideaInput" placeholder="Örn: Evde kahve yapma taktikleri..." class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none text-sm">
            </div>

            <button onclick="generateUltimateHook()" id="generateBtn" class="w-full bg-red-600 hover:bg-red-500 font-bold py-3 rounded-xl transition-all shadow-lg text-sm">
                Sınırsız Varyasyon Üret ⚡
            </button>
        </div>

        <!-- 2. SEKME: KANCA ANALİZ EDİCİ -->
        <div id="analyzerSection" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold text-zinc-400 mb-1 uppercase">Kendi Kancanı Test Et</label>
                <textarea id="customHookInput" placeholder="Yazdığın kanca cümlesini buraya yapıştır..." class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-sm text-zinc-200 focus:outline-none resize-none h-24"></textarea>
            </div>
            <button onclick="analyzeCustomHook()" id="analyzeBtn" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3 rounded-xl transition-all shadow-lg text-sm">
                Dopamin Puanını Hesapla 🎯
            </button>
        </div>

        <!-- SONUÇ ALANI -->
        <div id="resultArea" class="mt-6 hidden">
            <!-- Viral Skor Göstergesi -->
            <div id="scoreBox" class="mb-3 bg-zinc-800/80 border border-zinc-700 rounded-xl p-2.5 flex justify-between items-center text-xs">
                <span id="scoreLabelText" class="text-zinc-400 font-semibold">🔥 Tahmini Viral Etki Skoru:</span>
                <span id="viralScoreText" class="text-green-400 font-black">--</span>
            </div>

            <!-- Analiz Geri Bildirim Notu -->
            <div id="analysisFeedback" class="mb-3 bg-blue-950/40 border border-blue-900/50 rounded-xl p-3 text-xs text-blue-300 hidden"></div>

            <div class="flex justify-between items-center mb-1">
                <label class="block text-xs font-semibold text-zinc-400 uppercase" id="outputLabel">Üretilen Benzersiz Kanca:</label>
                <div class="flex gap-2">
                    <button onclick="speakCurrentHook()" id="speakBtn" class="text-xs text-blue-400 hover:text-blue-300 font-semibold hidden" title="Sesli Dinle">🔊 Dinle</button>
                    <button onclick="saveToFavorites()" id="favBtn" class="text-xs text-yellow-400 hover:text-yellow-300 font-semibold hidden" title="Favorilere Ekle">⭐ Favorile</button>
                    <button onclick="copyCurrentHook()" id="copyBtn" class="text-xs text-red-400 hover:text-red-300 font-semibold hidden">📋 Kopyala</button>
                </div>
            </div>
            
            <textarea id="hookOutput" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-sm text-zinc-200 mb-3 focus:outline-none resize-none h-20"></textarea>
            
            <!-- Hashtag Önerileri Alanı -->
            <div id="tagSection" class="mb-4 hidden">
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-[10px] font-semibold text-zinc-400 uppercase"># Popüler Viral Etiketler:</label>
                    <button onclick="copyTags()" class="text-[10px] text-red-400 hover:text-red-300 font-semibold">📋 Etiketleri Kopyala</button>
                </div>
                <div id="tagOutput" class="bg-zinc-800/60 border border-zinc-700 rounded-xl p-2.5 text-xs text-zinc-300 font-mono"></div>
            </div>

            <!-- Favoriler ve Geçmiş Sekmeleri -->
            <div class="grid grid-cols-2 gap-2 mb-4">
                <div>
                    <label class="block text-[10px] font-semibold text-zinc-400 uppercase mb-1">📜 Geçmiş:</label>
                    <div id="historyList" class="space-y-1.5 max-h-28 overflow-y-auto pr-1"></div>
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-zinc-400 uppercase mb-1">⭐ Favorilerim:</label>
                    <div id="favoritesList" class="space-y-1.5 max-h-28 overflow-y-auto pr-1 text-zinc-400 text-xs">Boş</div>
                </div>
            </div>

            <div id="lockSection" class="bg-zinc-800/50 border border-zinc-700/50 rounded-xl p-4 text-center">
                <p id="lockText" class="text-xs text-zinc-300 mb-3">Sınırsız matris ve analizör için aracı <span class="text-red-400 font-bold">WhatsApp'ta paylaşmalısın</span>.</p>
                <button id="shareBtn" onclick="handleShare()" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-2.5 rounded-xl transition-all text-xs flex items-center justify-center gap-2">
                    📢 WhatsApp'ta Paylaş & Kilidi Aç
                </button>
            </div>
        </div>
    </div>

    <script>
        let isUnlocked = false;
        let historyArray = [];
        let favoritesArray = JSON.parse(localStorage.getItem('viralFavoritesPro')) || [];
        let currentTagsText = "";

        const sampleIdeas = [
            "Sıfırdan e-ticaret kurmak",
            "Yapay zeka ile para kazanmak",
            "Erken kalkma alışkanlığı kazanmak",
            "Sosyal medyada organik büyümek",
            "Evde spor yaparak kilo vermek"
        ];

        function fillRandomIdea() {
            const random = sampleIdeas[Math.floor(Math.random() * sampleIdeas.length)];
            document.getElementById('ideaInput').value = random;
        }

        window.onload = function() {
            renderFavorites();
        };

        function switchTab(tab) {
            const genSec = document.getElementById('generatorSection');
            const anaSec = document.getElementById('analyzerSection');
            const genBtn = document.getElementById('genTabBtn');
            const anaBtn = document.getElementById('analyzerTabBtn');

            if(tab === 'generator') {
                genSec.classList.remove('hidden');
                anaSec.classList.add('hidden');
                genBtn.className = "py-2 text-xs font-bold rounded-lg bg-red-600 text-white transition-all";
                anaBtn.className = "py-2 text-xs font-semibold rounded-lg text-zinc-400 hover:text-white transition-all";
            } else {
                genSec.classList.add('hidden');
                anaSec.classList.remove('hidden');
                anaBtn.className = "py-2 text-xs font-bold rounded-lg bg-blue-600 text-white transition-all";
                genBtn.className = "py-2 text-xs font-semibold rounded-lg text-zinc-400 hover:text-white transition-all";
            }
        }

        function setTheme(theme) {
            const body = document.getElementById('bodyBg');
            const btn = document.getElementById('generateBtn');
            const anaBtn = document.getElementById('analyzeBtn');
            const badge = document.getElementById('badgeColor');

            if(theme === 'purple') {
                body.className = "bg-purple-950 text-white min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-500";
                btn.className = "w-full bg-purple-600 hover:bg-purple-500 font-bold py-3 rounded-xl transition-all shadow-lg text-sm";
                anaBtn.className = "w-full bg-purple-600 hover:bg-purple-500 font-bold py-3 rounded-xl transition-all shadow-lg text-sm";
                badge.className = "bg-purple-500/10 text-purple-400 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider";
            } else if(theme === 'green') {
                body.className = "bg-zinc-950 text-white min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-500";
                btn.className = "w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl transition-all shadow-lg text-sm";
                anaBtn.className = "w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl transition-all shadow-lg text-sm";
                badge.className = "bg-emerald-500/10 text-emerald-400 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider";
            } else {
                body.className = "bg-black text-white min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-500";
                btn.className = "w-full bg-red-600 hover:bg-red-500 font-bold py-3 rounded-xl transition-all shadow-lg text-sm";
                anaBtn.className = "w-full bg-blue-600 hover:bg-blue-500 font-bold py-3 rounded-xl transition-all shadow-lg text-sm";
                badge.className = "bg-red-500/10 text-red-500 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider";
            }
        }

        const matrixData = {
            openings: {
                mystery: [
                    "Bunu kimseye söylememem gerekiyordu ama {idea} konusundaki bu gizli detay",
                    "Gece yarısı fark ettiğim o küçük ayrıntı: {idea} gerçeğini",
                    "Sektördeki herkesin gizlemeye çalıştığı {idea} olayı nihayet",
                    "Bilmen gereken ama bizden saklanan {idea} sırrı aslında",
                    "Kimsenin konuşmaya cesaret edemediği {idea} meselesi başımıza"
                ],
                aggressive: [
                    "Hala {idea} hakkında bu aptalca hatayı yapıyorsanız, kesinlikle",
                    "Uyanın artık! {idea} konusunda tamamen yanlış yolda olduğunuzu",
                    "Kimse yüzünüze söylemiyor ama {idea} yüzünden her gün",
                    "Zamanınızı {idea} ile harcamayı bırakın, çünkü bu durum sizi",
                    "Büyük yalanlar sarmalında {idea} gerçeğini görmezden gelmek"
                ],
                success: [
                    "Sıfırdan zirveye çıkarken {idea} konusunda öğrendiğim en çılgın",
                    "Günde sadece 10 dakikayla {idea} alanında nasıl devrim yapabileceğinizi",
                    "Milyonlarca izlenen içeriklerin arkasındaki {idea} formülü tam olarak",
                    "Hayatımı tamamen tersine çeviren {idea} taktiğini uygulayarak",
                    "Başarılı insanların {idea} konusunda dışarı sızdırmadığı o gizli"
                ],
                funny: {
                    short: [
                        "Anneme {idea} yapacağımı söylediğimde verdiği o efsane tepki",
                        "Hayatımın en saçma anı: {idea} denerken az kalsın",
                        "Ciddi bir şey yapayım derken {idea} yüzünden düştüğüm o rezil",
                        "Çevremdekiler {idea} yapma dediğinde dinleseydim muhtemelen",
                        "Gülmekten karnıma ağrılar sokan o {idea} faciası:"
                    ],
                    story: [
                        "Geçen gün {idea} denerken başıma öyle bir komedi olay geldi ki",
                        "Profesyonel görünmeye çalışıp {idea} yüzünden maskara olduğum",
                        "Biri bana {idea} işinin bu kadar absürt olacağını kesinlikle"
                    ]
                }
            },
            actions: [
                "tüm ezberleri kökten bozuyor ve",
                "beklenmedik bir şekilde karşımıza çıkıp",
                "bütün planları alt üst ederek",
                "derinlemesine incelendiğinde şoke eden sonuçlar doğurarak",
                "hiç hesapta yokken önümüzü açarak",
                "etraflıca düşünüldüğünde kafaları karıştırarak",
                "sessiz sedasız her şeyi değiştirip"
            ],
            closings: [
                "bugünden itibaren her şeyi farklı görmenizi sağlayacak.",
                "ilk günden itibaren sonuç almanızı garantiliyor.",
                "rakiplerinizi geride bırakmanız için tam zamanı.",
                "asla göz ardı edemeyeceğiniz acı bir gerçeği gözler önüne seriyor.",
                "bütün bu süreci kökten sorgulamanıza neden olacak.",
                "büyük bir patlama yaratmak için aradığınız o eksik parça.",
                "şimdiye kadar bildiğiniz her şeyi çöpe atmanızı gerektiriyor."
            ]
        };

        function generateUltimateHook() {
            const idea = document.getElementById('ideaInput').value.trim();
            const platform = document.getElementById('platformSelect').value;
            const tone = document.getElementById('toneSelect').value;
            const style = document.getElementById('styleSelect').value;

            if(!idea) {
                alert("Önce bir fikir yaz dostum veya 'Rastgele Fikir' butonuna bas!");
                return;
            }

            const resultArea = document.getElementById('resultArea');
            const hookOutput = document.getElementById('hookOutput');
            const copyBtn = document.getElementById('copyBtn');
            const speakBtn = document.getElementById('speakBtn');
            const favBtn = document.getElementById('favBtn');
            const viralScoreText = document.getElementById('viralScoreText');
            const tagSection = document.getElementById('tagSection');
            const tagOutput = document.getElementById('tagOutput');
            const analysisFeedback = document.getElementById('analysisFeedback');
            const outputLabel = document.getElementById('outputLabel');
            
            analysisFeedback.classList.add('hidden');
            outputLabel.innerText = "Üretilen Benzersiz Kanca:";
            resultArea.classList.remove('hidden');

            if(!isUnlocked) {
                copyBtn.classList.add('hidden');
                speakBtn.classList.add('hidden');
                favBtn.classList.add('hidden');
                tagSection.classList.add('hidden');
                hookOutput.value = `🔒 "${idea}" için matris hazırlandı ancak kilitli! Devam etmek için paylaşmalısın.`;
                viralScoreText.innerText = "Kilitli 🔒";
                return;
            }

            hookOutput.value = "⏳ Infinity Matrisi tarıyor...";
            copyBtn.classList.add('hidden');
            speakBtn.classList.add('hidden');
            favBtn.classList.add('hidden');
            tagSection.classList.add('hidden');

            setTimeout(() => {
                let tonePool = matrixData.openings[tone];
                if(tone === 'funny' && style === 'story' && !Array.isArray(tonePool)) {
                    tonePool = matrixData.openings.funny.story;
                } else if(tone === 'funny' && style === 'short' && !Array.isArray(tonePool)) {
                    tonePool = matrixData.openings.funny.short;
                } else if(!Array.isArray(tonePool)) {
                    tonePool = matrixData.openings.mystery;
                }

                const randomOpen = tonePool[Math.floor(Math.random() * tonePool.length)];
                const randomAction = matrixData.actions[Math.floor(Math.random() * matrixData.actions.length)];
                const randomClose = matrixData.closings[Math.floor(Math.random() * matrixData.closings.length)];

                const finalResult = `${randomOpen} ${randomAction} ${randomClose}`.replace(/{idea}/g, `"${idea}"`);
                
                hookOutput.value = finalResult;
                copyBtn.classList.remove('hidden');
                speakBtn.classList.remove('hidden');
                favBtn.classList.remove('hidden');

                const cleanWord = idea.replace(/[^a-zA-Z0-9çğİıöşüÖŞÜÇĞ ]/g, "").replace(/\s+/g, "");
                currentTagsText = `#${cleanWord} #${platform} #viral #kesfet #trend #fyp`;
                tagOutput.innerText = currentTagsText;
                tagSection.classList.remove('hidden');

                const randomScore = Math.floor(Math.random() * 5) + 95;
                viralScoreText.innerText = `%${randomScore} Viral Potansiyel 🔥`;

                addToHistory(finalResult);
            }, 400);
        }

        function analyzeCustomHook() {
            const customHook = document.getElementById('customHookInput').value.trim();
            if(!customHook) {
                alert("Lütfen test etmek istediğin kancayı kutuya yaz!");
                return;
            }

            const resultArea = document.getElementById('resultArea');
            const hookOutput = document.getElementById('hookOutput');
            const copyBtn = document.getElementById('copyBtn');
            const speakBtn = document.getElementById('speakBtn');
            const favBtn = document.getElementById('favBtn');
            const viralScoreText = document.getElementById('viralScoreText');
            const tagSection = document.getElementById('tagSection');
            const analysisFeedback = document.getElementById('analysisFeedback');
            const outputLabel = document.getElementById('outputLabel');

            resultArea.classList.remove('hidden');

            if(!isUnlocked) {
                copyBtn.classList.add('hidden');
                speakBtn.classList.add('hidden');
                favBtn.classList.add('hidden');
                tagSection.classList.add('hidden');
                analysisFeedback.classList.add('hidden');
                hookOutput.value = `🔒 Kanca analizi için aracı kilitli! Devam etmek için paylaşmalısın.`;
                viralScoreText.innerText = "Kilitli 🔒";
                return;
            }

            hookOutput.value = customHook;
            outputLabel.innerText = "Test Edilen Kancanız:";
            copyBtn.classList.remove('hidden');
            speakBtn.classList.remove('hidden');
            favBtn.classList.remove('hidden');
            tagSection.classList.add('hidden'); // Kendi kancasında hashtag otomatik üretilmez

            // Basit kelime uzunluğu ve merak unsuru analizi simülasyonu
            let score = 70;
            let feedbackText = "💡 **Analiz Raporu:** Cümle uzunluğu ideal ancak merak unsuru biraz daha artırılabilir.";
            
            if(customHook.length < 15) {
                score = 65;
                feedbackText = "⚠️ **Uyarı:** Kancanız çok kısa. İzleyicide merak uyandırmak için biraz daha detay ekleyebilirsiniz.";
            } else if(customHook.includes("çünkü") || customHook.includes("gizli") || customHook.includes("asla") || customHook.includes("neden")) {
                score = 92;
                feedbackText = "🚀 **Mükemmel!** Cümleniz güçlü merak tetikleyicileri (gizli/neden/asla) içeriyor. İzleyiciyi tutma oranı çok yüksek!";
            } else {
                score = 84;
                feedbackText = "📈 **İyi İş:** Akıcı bir anlatım var. İlk 3 saniyede ses tonunuzla desteklerseniz harika iş yapar.";
            }

            viralScoreText.innerText = `%${score} Dopamin Puanı 🎯`;
            analysisFeedback.innerHTML = feedbackText;
            analysisFeedback.classList.remove('hidden');

            addToHistory(customHook);
        }

        function addToHistory(text) {
            if(!historyArray.includes(text)) {
                historyArray.unshift(text);
                if(historyArray.length > 5) historyArray.pop();
            }
            updateHistoryUI();
        }

        function updateHistoryUI() {
            const historyList = document.getElementById('historyList');
            if(historyArray.length > 0 && isUnlocked) {
                historyList.innerHTML = historyArray.map((item) => `
                    <div class="bg-zinc-800/80 border border-zinc-700 rounded p-1.5 text-[10px] text-zinc-300 flex justify-between items-center gap-1">
                        <span class="truncate">${item}</span>
                        <button onclick="copySpecific('${item.replace(/'/g, "\\'")}')" class="text-red-400 hover:text-red-300 whitespace-nowrap font-bold">📋</button>
                    </div>
                `).join('');
            }
        }

        function saveToFavorites() {
            const text = document.getElementById('hookOutput').value;
            if(!text || favoritesArray.includes(text)) return;
            favoritesArray.unshift(text);
            localStorage.setItem('viralFavoritesPro', JSON.stringify(favoritesArray));
            renderFavorites();
            alert("⭐ Favorilere eklendi!");
        }

        function renderFavorites() {
            const favList = document.getElementById('favoritesList');
            if(favoritesArray.length > 0) {
                favList.innerHTML = favoritesArray.map((item, index) => `
                    <div class="bg-zinc-800/80 border border-zinc-700 rounded p-1.5 text-[10px] text-zinc-300 flex justify-between items-center gap-1">
                        <span class="truncate">${item}</span>
                        <button onclick="removeFavorite(${index})" class="text-yellow-400 hover:text-yellow-300 whitespace-nowrap font-bold">❌</button>
                    </div>
                `).join('');
            } else {
                favList.innerHTML = '<span class="text-[10px] text-zinc-500">Henüz favori yok</span>';
            }
        }

        function removeFavorite(index) {
            favoritesArray.splice(index, 1);
            localStorage.setItem('viralFavoritesPro', JSON.stringify(favoritesArray));
            renderFavorites();
        }

        function copyCurrentHook() {
            const currentText = document.getElementById('hookOutput').value;
            if(!currentText) return;
            navigator.clipboard.writeText(currentText);
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.innerText = "✅ Kopyalandı!";
            setTimeout(() => { copyBtn.innerText = "📋 Kopyala"; }, 1500);
        }

        function copyTags() {
            if(!currentTagsText) return;
            navigator.clipboard.writeText(currentTagsText);
            alert("Etiketler panoya kopyalandı! 🏷️");
        }

        function copySpecific(text) {
            navigator.clipboard.writeText(text);
            alert("Kanca panoya kopyalandı! 🚀");
        }

        function speakCurrentHook() {
            const text = document.getElementById('hookOutput').value;
            if(!text || !('speechSynthesis' in window)) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'tr-TR';
            window.speechSynthesis.speak(utterance);
        }

        function handleShare() {
            const siteUrl = window.location.href;
            const text = encodeURIComponent("100k+ matris ve AI kanca analizcisi barındıran bu aracı kesinlikle denemelisin: " + siteUrl);
            
            window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');

            const shareBtn = document.getElementById('shareBtn');
            
            shareBtn.disabled = true;
            shareBtn.className = "w-full bg-zinc-700 text-zinc-400 font-bold py-2.5 rounded-xl text-xs cursor-not-allowed";
            
            let countdown = 5;
            shareBtn.innerText = `⏳ Doğrulanıyor (${countdown}s)...`;

            let timer = setInterval(() => {
                countdown--;
                if(countdown > 0) {
                    shareBtn.innerText = `⏳ Doğrulanıyor (${countdown}s)...`;
                } else {
                    clearInterval(timer);
                    isUnlocked = true;
                    document.getElementById('lockSection').innerHTML = '<p class="text-xs text-green-400 font-bold">🎉 Doğrulandı! Sınırsız matris ve analizör aktif.</p>';
                    generateUltimateHook();
                }
            }, 1000);
        }
    </script>
</body>
</html>
