<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saf Yerel Metin Üretici</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 font-sans">
    <div class="max-w-3xl mx-auto space-y-6">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
            <h1 class="text-xl font-bold text-cyan-400 mb-2">🛡️ %100 Saf Çevrimdışı Üretici</h1>
            <p class="text-xs text-slate-400 mb-4">Bu sistem internet veya API kullanmaz. Tamamen tarayıcında çalışır.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Konu / Niş:</label>
                    <input type="text" id="userInput" value="Yapay Zeka ve Yazılım" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 text-white">
                </div>
                <button onclick="uret()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-xl transition text-sm">
                    API Olmadan Üret
                </button>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Çıktı Ekranı:</h2>
            <div id="sonuc" class="bg-slate-950 border border-slate-800 p-4 rounded-xl text-sm text-cyan-300 font-mono whitespace-pre-wrap min-h-[200px]">
                Üretim bekleniyor...
            </div>
        </div>
    </div>

    <script>
        const sozluk1 = [
            "Çoğu insanın {konu} hakkında yaptığı o büyük hata,",
            "Eğer {konu} ile ilgileniyorsan bu gerçek seni şoke edecek,",
            "Büyüklerin {konu} konusunda senden sakladığı o gizli detay,",
            "Neden 10 kişiden 9'u {konu} konusunda başarısız oluyor?"
        ];
        
        const sozluk2 = [
            "Sistemin açıklarını incelediğimizde fark ettik ki,",
            "Küçük bir ayar değiştirerek sonuçları 5 katına çıkarabilirsin,",
            "Profesyoneller bu yöntemi yıllardır sessizce kullanıyor,"
        ];

        const sozluk3 = [
            "Bu bilgiyi kaydet, yarın lazım olacak.",
            "Detaylar için profili incele.",
            "Arkadaşlarınla paylaşmayı unutma."
        ];

        function uret() {
            const konu = document.getElementById('userInput').value || "Genel";
            
            const r1 = sozluk1[Math.floor(Math.random() * sozluk1.length)].replaceAll('{konu}', konu);
            const r2 = sozluk2[Math.floor(Math.random() * sozluk2.length)];
            const r3 = sozluk3[Math.floor(Math.random() * sozluk3.length)];

            const metin = `--- YEREL SENTEZ RAPORU ---\n\n1. Kanca:\n"${r1}"\n\n2. Gelişmiş Strateji:\n"${r2}"\n\n3. Kapanış:\n"${r3}"\n\n[Durum]: Harici API çağrısı yapılmadı. %100 Yerel Çalıştı.`;
            
            document.getElementById('sonuc').innerText = metin;
        }
    </script>
</body>
</html>
