<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Hook AI - Ultimate Enterprise Edition v2026</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: #0f172a;
            --border-color: #1e293b;
            --text-main: #f3f4f6;
            --text-muted: #94a3b8;
            --accent-cyan: #38bdf8;
            --accent-purple: #a855f7;
            --btn-gradient: linear-gradient(to right, #0284c7, #9333ea);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); padding: 16px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .wrapper { width: 100%; max-width: 600px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7); }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 14px; }
        .header h1 { font-size: 18px; font-weight: 800; background: linear-gradient(to right, var(--accent-cyan), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .badge { font-size: 10px; background: rgba(56, 189, 248, 0.1); color: var(--accent-cyan); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.2); font-weight: bold; letter-spacing: 0.5px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
        .form-group { margin-bottom: 14px; }
        .form-group.full { grid-column: span 2; }
        label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 12px 14px; background: #020617; border: 1px solid #334155; color: #fff; border-radius: 10px; font-size: 13px; outline: none; transition: border-color 0.2s; }
        input:focus, select:focus { border-color: var(--accent-cyan); }
        .gen-btn { width: 100%; margin-top: 6px; padding: 14px; background: var(--btn-gradient); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; transition: opacity 0.2s, transform 0.1s; }
        .gen-btn:hover { opacity: 0.9; }
        .gen-btn:active { transform: scale(0.98); }
        .output-container { margin-top: 18px; }
        .output-box { background: #020617; border: 1px solid var(--border-color); border-radius: 10px; padding: 16px; font-size: 13px; color: var(--accent-cyan); white-space: pre-wrap; line-height: 1.6; min-height: 140px; }
        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .action-btn { flex: 1; padding: 10px; background: #1e293b; color: #cbd5e1; border: 1px solid #334155; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 12px; transition: background 0.2s, color 0.2s; }
        .action-btn:hover { background: #334155; color: #fff; }
        .vault-section { margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 14px; }
        .vault-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .vault-list { max-height: 100px; overflow-y: auto; font-size: 12px; color: var(--text-muted); }
        .vault-item { background: #020617; padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #1e293b; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="header">
            <h1>Viral Hook AI</h1>
            <span class="badge">ULTIMATE v2026</span>
        </div>
        
        <div class="form-group full">
            <label>Niş / İçerik Konusu</label>
            <input type="text" id="niche" value="Yapay Zeka ve Otomasyon">
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label>Psikolojik Tetikleyici</label>
                <select id="trigger">
                    <option value="curiosity">🔥 Derin Merak Boşluğu</option>
                    <option value="fomo">⚡ Agresif FOMO</option>
                    <option value="secret">💎 Gizli Sırlar</option>
                    <option value="challenge">🛑 Sert Uyarı / İtiraz</option>
                </select>
            </div>
            <div class="form-group">
                <label>Çıkış Dili</label>
                <select id="lang">
                    <option value="tr">Türkçe</option>
                    <option value="en">English</option>
                    <option value="de">Deutsch</option>
                </select>
            </div>
        </div>

        <button class="gen-btn" onclick="generateHook()">🚀 100M+ Hook Sentezle</button>

        <div class="output-container">
            <div class="output-box" id="output">Sistem tamamen hazır. Kanca üretmek için yukarıdaki butona tıklayın...</div>
            <div class="btn-row">
                <button class="action-btn" onclick="copyHook()">📋 Panoya Kopyala</button>
                <button class="action-btn" onclick="saveToVault()">💾 Vault'a Kaydet</button>
            </div>
        </div>

        <div class="vault-section">
            <div class="vault-title">
                <span>Kayıtlı Hafıza (Vault)</span>
                <span id="vaultCount" style="color: var(--accent-cyan);">0 Kayıt</span>
            </div>
            <div class="vault-list" id="vaultList">
                <div style="font-style: italic; color: #475569;">Henüz kayıt yok...</div>
            </div>
        </div>
    </div>

    <script>
        const database = {
            tr: {
                curiosity: [
                    "Çoğu insan {niche} alanındaki bu ölümcül hatayı yaptığı için asla büyüemiyor...",
                    "Eğer {niche} ile ilgileniyorsan, önümüzdeki 3 saniye içinde öğreneceğin bu bilgi tüm ezberleri bozacak.",
                    "Büyük içerik üreticilerinin {niche} hakkında senden sakladığı o gizli yöntem nihayet açıklandı.",
                    "Neden 10 kişiden 9'u {niche} konusunda yanlış yoldan gidiyor? İşte cevabı."
                ],
                fomo: [
                    "Eğer bugün {niche} stratejini güncellemezsen, önümüzdeki ay tamamen silinip gideceksin.",
                    "Herkes {niche} alanındaki bu devrimi konuşuyor ama sen hala geriden takip ediyorsun.",
                    "Bu {niche} açığı kapanmadan hemen önce kesinlikle görmen gereken bir video."
                ],
                secret: [
                    "Yıllardır kimsenin söylemeye cesaret edemediği o gerçek {niche} sırrı...",
                    "Sadece en üst düzey profesyonellerin bildiği gizli {niche} optimizasyon taktiği.",
                    "Sıfırdan başlayıp {niche} alanında zirveye çıkanların uyguladığı tek kural."
                ],
                challenge: [
                    "Eğer {niche} konusunda gerçekten iddialıysan, bu videoyu sonuna kadar izle.",
                    "Dur! {niche} yapmaya devam etmeden önce bu uyarıyı mutlaka dinlemelisin.",
                    "Biri çıkıp {niche} hakkında bu acı gerçeği söylemeliydi, o yüzden ben söylüyorum."
                ]
            },
            en: {
                curiosity: [
                    "Why 99% of people in {niche} fail because they miss this exact fatal detail...",
                    "If you are into {niche}, the next 3 seconds will completely destroy everything you thought you knew.",
                    "The hidden blueprint that top creators in {niche} use behind closed doors is finally revealed."
                ],
                fomo: [
                    "If you don't update your {niche} strategy today, you'll be completely left behind next month.",
                    "Everyone is talking about this {niche} revolution while you are still standing still."
                ],
                secret: [
                    "The ultimate {niche} secret that elite experts refuse to share publicly...",
                    "The exact insider framework used to scale {niche} from absolute zero."
                ],
                challenge: [
                    "If you actually think you're good at {niche}, prove it by watching this.",
                    "Stop everything you are doing in {niche} and listen to this warning."
                ]
            },
            de: {
                curiosity: [
                    "Warum 99% der Menschen in {niche} scheitern, weil sie dieses Detail übersehen...",
                    "Wenn du dich für {niche} interessierst, wird dieses Video alles verändern."
                ],
                fomo: [
                    "Wenn du deine {niche} Strategie heute nicht änderst, wirst du bald abgehängt."
                ],
                secret: [
                    "Das streng geheime {niche} Insider-Wissen, das dir niemand verrät."
                ],
                challenge: [
                    "Stopp! Bevor du weitermachst, höre dir diese Warnung über {niche} an."
                ]
            }
        };

        let lastGeneratedText = "";
        let vault = [];

        try {
            const saved = localStorage.getItem('viral_vault_data');
            if (saved) vault = JSON.parse(saved);
        } catch(e) { vault = []; }
        renderVault();

        function generateHook() {
            const nicheVal = document.getElementById('niche').value.trim() || "Genel Konu";
            const triggerVal = document.getElementById('trigger').value;
            const langVal = document.getElementById('lang').value;

            const langDB = database[langVal] || database['tr'];
            const categoryArray = langDB[triggerVal] || langDB['curiosity'];
            const randomTemplate = categoryArray[Math.floor(Math.random() * categoryArray.length)];
            const rawHook = randomTemplate.replace(/{niche}/g, nicheVal);

            lastGeneratedText = `"${rawHook}"`;

            const outputReport = 
`🎯 ÜRETİLEN VİRAL KANCA (${langVal.toUpperCase()}):
--------------------------------------------------
${lastGeneratedText}

💡 STRATEJİ: İlk 3 saniyede bu cümleyi ekranda büyük fontla tut ve arkaya tempolu dinamik bir müzik ekle!`;

            document.getElementById('output').innerText = outputReport;
        }

        function copyHook() {
            if (!lastGeneratedText) {
                alert("Önce kanca üretmelisiniz!");
                return;
            }
            navigator.clipboard.writeText(lastGeneratedText).then(() => {
                alert("Kanca başarıyla panoya kopyalandı!");
            });
        }

        function saveToVault() {
            if (!lastGeneratedText) {
                alert("Kaydedilecek bir kanca yok!");
                return;
            }
            vault.unshift({ text: lastGeneratedText, time: new Date().toLocaleTimeString() });
            if (vault.length > 5) vault.pop(); // Son 5 kaydı tut
            try {
                localStorage.setItem('viral_vault_data', JSON.stringify(vault));
            } catch(e) {}
            renderVault();
            alert("Vault hafızasına başarıyla kaydedildi!");
        }

        function renderVault() {
            const listEl = document.getElementById('vaultList');
            const countEl = document.getElementById('vaultCount');
            countEl.innerText = `${vault.length} Kayıt`;

            if (vault.length === 0) {
                listEl.innerHTML = `<div style="font-style: italic; color: #475569;">Henüz kayıt yok...</div>`;
                return;
            }

            listEl.innerHTML = "";
            vault.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "vault-item";
                div.innerHTML = `<span style="truncate; max-width: 320px; color: #cbd5e1;">${index + 1}. ${item.text}</span> <span style="font-size: 10px; color: var(--accent-cyan);">${item.time}</span>`;
                listEl.appendChild(div);
            });
        }
    </script>
</body>
</html>
