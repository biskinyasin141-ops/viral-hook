<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralPulse - 3 Saniyede Viral Ol</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl">
        <div class="text-center mb-6">
            <span class="bg-red-500/10 text-red-500 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Viral Makine v2.1</span>
            <h1 class="text-2xl font-black mt-2 tracking-tight">Algoritmayı Hackle 🚀</h1>
            <p class="text-zinc-400 text-sm mt-1">Fikrini yaz, milyonlara ulaşan kancayı yapay zeka saniyeler içinde patratsın.</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-zinc-400 mb-1 uppercase">İçerik Konun / Fikrin nedir?</label>
                <input type="text" id="ideaInput" placeholder="Örn: Sıfırdan zengin olma hikayesi..." class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-red-500 text-sm">
            </div>

            <button onclick="generateViralHook()" id="generateBtn" class="w-full bg-red-600 hover:bg-red-500 font-bold py-3 rounded-xl transition-all shadow-lg shadow-red-600/30 text-sm">
                Kancayı Üret 🔥
            </button>
        </div>

        <div id="resultArea" class="mt-6 hidden">
            <label class="block text-xs font-semibold text-zinc-400 mb-1 uppercase">Üretilen Viral Kanca:</label>
            <div id="hookOutput" class="bg-zinc-800 border border-zinc-700 rounded-xl p-4 text-sm text-zinc-200 mb-3"></div>
            
            <div id="lockSection" class="bg-zinc-800/50 border border-zinc-700/50 rounded-xl p-4 text-center">
                <p id="lockText" class="text-xs text-zinc-300 mb-3">Daha fazla kanca üretmek için bu aracı <span class="text-red-400 font-bold">1 arkadaşınla</span> paylaşmalısın! (<span id="shareCount">0</span>/1)</p>
                <button onclick="handleShare()" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-2.5 rounded-xl transition-all text-xs flex items-center justify-center gap-2">
                    📢 WhatsApp'ta Paylaş & Kilidi Aç
                </button>
            </div>
        </div>
    </div>

    <script>
        let isUnlocked = false;

        function generateViralHook() {
            const idea = document.getElementById('ideaInput').value;
            if(!idea) {
                alert("Önce bir fikir yaz dostum!");
                return;
            }

            if(!isUnlocked) {
                document.getElementById('resultArea').classList.remove('hidden');
                document.getElementById('hookOutput').innerText = "🔒 " + idea + " için kanca hazır ama kilitli! Devam etmek için paylaşmalısın.";
                return;
            }

            const hooks = [
                "99% insan bu hatayı yaptığı için asla büyüemiyor...",
                "Bunu öğrendikten sonra içerik üretme bitti: ",
                "Kimsenin sana söylemediği o gizli 3 adımlı sır: "
            ];
            const randomHook = hooks[Math.floor(Math.random() * hooks.length)] + " [" + idea + "]";
            
            document.getElementById('hookOutput').innerText = randomHook;
            document.getElementById('resultArea').classList.remove('hidden');
        }

        function handleShare() {
            const siteUrl = window.location.href;
            const text = encodeURIComponent("Bu yapay zeka aracı TikTok algoritmalarını alt üst ediyor, mutlaka dene: " + siteUrl);
            
            // Panoya kopyala
            navigator.clipboard.writeText(window.location.href);

            // WhatsApp'ı aç
            window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');

            // Kilidi aç
            document.getElementById('shareCount').innerText = "1";
            isUnlocked = true;
            
            setTimeout(() => {
                document.getElementById('lockSection').innerHTML = '<p class="text-xs text-green-400 font-bold">🎉 Kilit Açıldı! Artık sınırsız kanca üretebilirsin.</p>';
            }, 800);
        }
    </script>
</body>
</html>
