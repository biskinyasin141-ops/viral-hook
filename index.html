                <button onclick="setTheme('purple')" title="Cyber" class="w-4 h-4 rounded-full bg-purple-600 hover:scale-110 transition-transform"></button>
                <button onclick="setTheme('emerald')" title="Matrix" class="w-4 h-4 rounded-full bg-emerald-600 hover:scale-110 transition-transform"></button>

        <div class="text-center mb-6 pt-2">

        </div>

        <div class="grid grid-cols-2 gap-2 mb-5 bg-zinc-950/60 p-1.5 rounded-2xl border border-zinc-800">
            <button onclick="switchTab('generator')" id="genTabBtn" class="py-2.5 text-xs font-bold rounded-xl bg-red-600 text-white transition-all shadow-md">⚡ Kanca Üretici</button>
            <button onclick="switchTab('analyzer')" id="analyzerTabBtn" class="py-2.5 text-xs font-semibold rounded-xl text-zinc-400 hover:text-white transition-all">🎯 Kanca Analiz Et</button>
        </div>

        <div id="generatorSection" class="space-y-4">
            <div>
                <label id="lblPlatform" class="block text-[11px] font-bold text-zinc-400 mb-1.5 uppercase tracking-wider">Hedef Platform</label>
                <select id="platformSelect" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-4 py-3 text-zinc-200 focus:outline-none focus:border-red-500 text-xs">
                    <option value="tiktok">TikTok / Reels / Shorts (Dikey Video)</option>
                    <option value="youtube">YouTube Uzun Video Başlığı</option>
                    <option value="twitter">X / Threads Gönderisi</option>
                    <option value="sales">Dönüşüm Odaklı Satış Metni</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label id="lblTone" class="block text-[11px] font-bold text-zinc-400 mb-1.5 uppercase tracking-wider">Anlatım Tonu</label>
                    <select id="toneSelect" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-3 py-3 text-zinc-200 focus:outline-none focus:border-red-500 text-xs">
                        <option value="mystery">Gizem & Merak 🕵️‍♂️</option>
                        <option value="aggressive">Sarsıcı / Gerçek 🔥</option>
                        <option value="success">Başarı & İlham 📈</option>
                        <option value="funny">Mizahi & Absürt 😂</option>
                    </select>
                </div>
                <div>
                    <label id="lblStyle" class="block text-[11px] font-bold text-zinc-400 mb-1.5 uppercase tracking-wider">Kanca Yapısı</label>
                    <select id="styleSelect" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-3 py-3 text-zinc-200 focus:outline-none focus:border-red-500 text-xs">
                        <option value="short">Ultra Kısa & Vurucu</option>
                        <option value="story">Hikaye / İtiraf Modu</option>
                    </select>
                </div>
            </div>

            <div>

                    <label id="lblIdea" class="block text-[11px] font-bold text-zinc-400 uppercase tracking-wider">İçerik Konun / Nişin Nedir?</label>

                Pro Matrisi Çalıştır ⚡
            </button>

            <div id="scoreBox" class="bg-zinc-950/80 border border-zinc-800 rounded-2xl p-3 flex justify-between items-center text-xs">
                <span id="scoreLabelText" class="text-zinc-400 font-medium">🔥 Tahmini Viral Etki Skoru:</span>
                <span id="viralScoreText" class="text-emerald-400 font-black text-sm">--</span>
            </div>

            <div id="proReportBox" class="bg-indigo-950/30 border border-indigo-900/40 rounded-2xl p-3 text-[11px] text-indigo-300 hidden leading-relaxed"></div>

            <div class="flex justify-between items-center">
                <label id="outputLabel" class="block text-[11px] font-bold text-zinc-400 uppercase tracking-wider">Üretilen Kanca:</label>
                <div class="flex items-center gap-3">
                    <span id="charCount" class="text-[10px] text-zinc-500">0 karakter</span>
                    <button onclick="speakCurrentHook()" id="speakBtn" class="text-xs text-blue-400 hover:text-blue-300 font-bold flex items-center gap-1" title="Sesli Dinle">🔊 Dinle</button>
                    <button onclick="saveToFavorites()" id="favBtn" class="text-xs text-yellow-400 hover:text-yellow-300 font-bold flex items-center gap-1" title="Favorile">⭐ Favorile</button>
                    <button onclick="copyCurrentHook()" id="copyBtn" class="text-xs text-red-400 hover:text-red-300 font-bold">📋 Kopyala</button>
                </div>
            </div>
            
            <textarea id="hookOutput" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl p-3.5 text-xs text-zinc-200 focus:outline-none resize-none h-20" readonly></textarea>
            
            <div id="tagSection" class="hidden">
                <div class="flex justify-between items-center mb-1">
                    <label id="lblTagsTitle" class="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider"># Optimizasyon Etiketleri:</label>
                    <button onclick="copyTags()" id="btnCopyTags" class="text-[10px] text-red-400 hover:text-red-300 font-semibold">📋 Etiketleri Kopyala</button>

                <div id="tagOutput" class="bg-zinc-950/60 border border-zinc-800 rounded-xl p-2.5 text-[11px] text-zinc-300 font-mono"></div>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">

                    <label id="lblHistory" class="block text-[10px] font-bold text-zinc-400 uppercase mb-1.5">📜 Geçmiş:</label>
                    <div id="historyList" class="space-y-1.5 max-h-32 overflow-y-auto pr-1"></div>
                </div>
                <div>

                    <div id="favoritesList" class="space-y-1.5 max-h-32 overflow-y-auto pr-1 text-zinc-400 text-xs">Boş</div>
                </div>
            </div>

                    📢 WhatsApp'ta Gerçekten Paylaş & Kilidi Kaldır
                </button>
            </div>
        </div>
    </div>
